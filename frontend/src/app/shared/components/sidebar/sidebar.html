<!-- Overlay for mobile -->
<div *ngIf="isOpen" class="fixed inset-0 bg-black/50 z-10 md:hidden" (click)="onClose()"></div>
<nav aria-label="Sidebar Navigation" class="bg-primary dark:bg-primary fixed left-0 top-0 h-full w-[240px] flex flex-col py-6 z-20 transition-transform duration-300 ease-in-out"
     [ngClass]="isOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'">
<!-- Logo -->
<div class="px-6 mb-8 flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-fixed text-3xl" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<div>
<h1 class="font-display-lg text-display-lg font-bold text-on-primary dark:text-on-primary !text-2xl leading-none">ExpenseIQ</h1>
<span class="font-body-md text-body-md text-secondary-fixed dark:text-secondary-fixed-dim text-xs opacity-80">Financial Intelligence</span>
</div>
</div>
<!-- Main Links -->
<ul class="flex flex-col gap-1 flex-1 px-3">
<li>
<a class="flex items-center gap-3 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150 text-on-primary/70 pl-4" routerLink="/dashboard" routerLinkActive="bg-on-primary-fixed-variant/10 !text-secondary-fixed border-l-4 border-secondary-fixed !pl-3">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-title-sm text-title-sm">Dashboard</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150 text-on-primary/70 pl-4" routerLink="/expenses" routerLinkActive="bg-on-primary-fixed-variant/10 !text-secondary-fixed border-l-4 border-secondary-fixed !pl-3">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-body-md text-body-md">Expenses</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150 text-on-primary/70 pl-4" routerLink="/analytics" routerLinkActive="bg-on-primary-fixed-variant/10 !text-secondary-fixed border-l-4 border-secondary-fixed !pl-3">
<span class="material-symbols-outlined" data-icon="insights">insights</span>
<span class="font-body-md text-body-md">Analytics</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150 text-on-primary/70 pl-4" routerLink="/budgets" routerLinkActive="bg-on-primary-fixed-variant/10 !text-secondary-fixed border-l-4 border-secondary-fixed !pl-3">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-body-md text-body-md">Budgets</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150 text-on-primary/70 pl-4" routerLink="/categories" routerLinkActive="bg-on-primary-fixed-variant/10 !text-secondary-fixed border-l-4 border-secondary-fixed !pl-3">
<span class="material-symbols-outlined" data-icon="category">category</span>
<span class="font-body-md text-body-md">Categories</span>
</a>
</li>
</ul>
<!-- Divider -->
<hr class="border-on-primary-fixed-variant mx-6 my-4"/>
<!-- Footer Links -->
<ul class="flex flex-col gap-1 px-3 mb-auto">
<li>
<a class="flex items-center gap-3 text-on-primary/70 dark:text-on-primary/70 pl-4 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150" routerLink="/settings" routerLinkActive="bg-on-primary-fixed-variant/10 !text-secondary-fixed border-l-4 border-secondary-fixed !pl-3">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-body-md text-body-md">Settings</span>
</a>
</li>
<li>
<a class="flex items-center gap-3 text-on-primary/70 dark:text-on-primary/70 pl-4 py-2 rounded-r hover:bg-on-primary-fixed-variant/20 hover:text-on-primary transition-colors active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="help">help</span>
<span class="font-body-md text-body-md">Help</span>
</a>
</li>
</ul>
<!-- User Profile -->
<div class="mt-4 px-6 flex items-center justify-between" *ngIf="authService.currentUser$ | async as user">
<div class="flex items-center gap-3 cursor-pointer group">
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-on-secondary font-title-sm text-title-sm group-hover:bg-secondary-fixed transition-colors">
                    {{ user.name.charAt(0).toUpperCase() }}
                </div>
<div class="flex flex-col">
<span class="font-title-sm text-title-sm text-on-primary group-hover:text-secondary-fixed transition-colors">{{ user.name }}</span>
</div>
</div>
<button aria-label="Logout" class="text-on-primary/70 hover:text-error transition-colors" (click)="authService.logout()">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
</button>
</div>
</nav>
