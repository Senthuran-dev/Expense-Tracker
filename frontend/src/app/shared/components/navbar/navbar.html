<header class="bg-surface dark:bg-surface-dim fixed top-0 right-0 w-full md:w-[calc(100%-240px)] h-16 border-b border-outline-variant dark:border-outline shadow-sm flex items-center justify-between px-6 z-10 transition-all duration-300">
<div class="flex items-center gap-4">
<button aria-label="Open Menu" class="md:hidden text-on-surface hover:bg-surface-container-low p-2 rounded-full transition-colors" (click)="onToggleSidebar()">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h2 class="font-title-sm text-title-sm font-bold text-on-surface dark:text-on-surface !text-xl">{{ pageTitle }}</h2>
</div>
<div class="flex items-center gap-4">
<!-- Actions -->
<div class="flex items-center gap-2">
<button aria-label="Search" class="text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-all active:opacity-80 duration-200">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<button aria-label="Notifications" class="relative text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-all active:opacity-80 duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="absolute top-1 right-1 w-4 h-4 bg-error text-on-error rounded-full font-label-caps text-[10px] flex items-center justify-center border-2 border-surface">3</span>
</button>
</div>
<!-- Date Chip -->
<button class="hidden md:flex items-center gap-1 border border-secondary text-secondary font-title-sm text-title-sm px-3 py-1.5 rounded-full hover:bg-secondary/10 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="calendar_month">calendar_month</span>
                    {{ currentMonthYear }}
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</button>
<!-- Avatar Right -->
<div class="w-8 h-8 rounded-full bg-secondary flex items-center justify-center text-on-secondary font-title-sm text-title-sm cursor-pointer hover:ring-2 ring-secondary ring-offset-2 ring-offset-surface transition-all" *ngIf="authService.currentUser$ | async as user">
                    {{ user.name.charAt(0).toUpperCase() }}
                </div>
</div>
</header>
