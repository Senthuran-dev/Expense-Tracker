<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000666"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8df5e4"/>
      <stop offset="100%" stop-color="#00bfa5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded icon tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#bdc2ff" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Gold coin peeking -->
  <circle cx="39" cy="22" r="7.5" fill="#ffca28" stroke="#ffa000" stroke-width="0.8"/>
  <circle cx="39" cy="22" r="5.5" fill="none" stroke="#fff9c4" stroke-width="0.6"/>
  <text x="39" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="#6d4c41" text-anchor="middle">$</text>

  <!-- Wallet Body -->
  <rect x="10" y="24" width="44" height="28" rx="6" fill="url(#accentGrad)"/>
  
  <!-- Flap -->
  <path d="M 10 32 C 10 27 13 24 17 24 L 47 24 C 51 24 54 27 54 32 L 10 32 Z" fill="#007165" fill-opacity="0.5"/>
  <line x1="14" y1="30" x2="50" y2="30" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Clasp strap -->
  <rect x="36" y="32" width="18" height="12" rx="3.5" fill="#004d40"/>
  <circle cx="42" cy="38" r="2.2" fill="#8df5e4" stroke="#ffffff" stroke-width="0.6"/>
</svg>

