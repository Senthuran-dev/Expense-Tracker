spring:
  application:
    name: backend
  datasource:
    # Replace these placeholders with your Supabase credentials
    url: jdbc:postgresql://<SUPABASE_HOST>:<SUPABASE_PORT>/<SUPABASE_DBNAME>
    username: <SUPABASE_USER>
    password: <SUPABASE_PASSWORD>
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    # A dummy 256-bit secret key for local development
    secret: MzYxM2Y4MWMyZGI4MjliNmU3OWZhNGJkMDUyYzRhNzI4Nzk2ZTMyNjg5OGI1MzQxNWJmNWRjMTMwYWNjMmE4OA==
    # 24 hours in milliseconds
    expiration: 86400000
